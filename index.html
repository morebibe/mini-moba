<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

#s0{width:62px;height:62px;right:104px;bottom:2px}#s1{width:62px;height:62px;right:92px;bottom:76px}#s2{width:68px;height:68px;right:10px;bottom:104px;border-color:#fbbf24}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;padding:10px;z-index:5;overflow:auto;
 background:radial-gradient(ellipse at 50% 0%,#3b2a7a 0%,#141a3a 55%,#070a18 100%)}
.overlay::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,#ffffff06 0 2px,transparent 2px 22px);pointer-events:none}

@keyframes sh{to{background-position:300%}}

.st span{height:6px;border-radius:9px;background:#0007;overflow:hidden}.st span i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#a3e635)}

.big{margin-top:14px;padding:12px 28px;font-size:18px;font-weight:900;border:0;border-radius:16px;background:linear-gradient(180deg,#fde047,#f59e0b);color:#3b1d00;box-shadow:inset 0 2px 0 #fff8,0 5px 0 #b45309,0 8px 18px #000a;font-family:inherit;position:relative}
.big:active{transform:translateY(3px);box-shadow:inset 0 2px 0 #fff8,0 2px 0 #b45309}
.stats{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center;position:relative}.stats div{background:linear-gradient(180deg,#273457,#141b33);border:1px solid #ffffff22;border-radius:14px;padding:8px 14px;min-width:84px}
.stats b{display:block;font-size:22px}.stats small{color:#94a3b8;font-size:11px}

@keyframes pop{from{transform:scale(.2);opacity:0}}
.win{color:#fde047;text-shadow:0 0 24px #f59e0b,0 4px 0 #92400e}.lose{color:#cbd5e1;text-shadow:0 0 24px #ef4444,0 4px 0 #450a0a}
#banner{position:fixed;top:20%;left:50%;transform:translateX(-50%);padding:8px 20px;border-radius:14px;background:linear-gradient(90deg,#0000,#000b 15%,#000b 85%,#0000);font-size:19px;font-weight:900;text-shadow:0 2px 6px #000;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap}
#dead{position:fixed;top:40%;left:0;right:0;text-align:center;font-size:24px;font-weight:900;text-shadow:0 2px 8px #000;display:none;pointer-events:none;color:#fecaca}
#rot{display:none}@media (orientation:portrait){#rot{display:flex;z-index:9}}#rot.x{display:none!important}
@media (max-height:520px){.ttl{font-size:24px}.hc{width:180px;padding:4px 8px 8px}.hc canvas{width:60px;height:60px}.hc b.n{font-size:15px}.st{margin:3px 0;gap:1px 6px}.hc small{font-size:10px;line-height:1.3}.overlay p{font-size:11.5px}.res{font-size:40px}}
#smute{position:absolute;top:10px;right:12px;z-index:2}
</style></head><body>
<canvas id="cv"></canvas>
<div id="hud"><div><span class="pill" id="mute">🔊</span><span class="pill" id="hg"></span><span class="pill" id="hl"></span><span class="pill" id="hk"></span><span class="pill" id="ht"></span></div>

<div id="banner"></div><div id="dead"></div>
<div class="overlay" id="sel"><button class="gbtn" id="smute">🔊</button><h1 class="ttl">⚔️ LABANAN SA LANE</h1><p>Mini MOBA · Pumili ng bayani at wasakin ang base ng kalaban!</p><div class="heroes" id="heroes"></div>
<p style="margin-top:10px">📱 Kaliwa: joystick · Kanan: ⚔️ atake + 3 skills &nbsp;|&nbsp; ⌨️ WASD galaw · J/Space atake · 1/2/3 skills</p></div>
<div class="overlay" id="endo" style="display:none"></div>
<div class="overlay" id="rot"><h1 class="ttl">📱↻</h1><p>I-rotate ang phone (landscape) para mas maganda ang laro.</p><button class="big" onclick="this.parentNode.classList.add('x')">Sige, laro pa rin</button></div>
<script>
const $=id=>document.getElementById(id),cv=$('cv');let ctx=cv.getContext('2d');
let DPR=1,W=0,H=0,S=1,VW=0;
function resize(){DPR=Math.min(innerWidth>900?2:1.75,devicePixelRatio||1);W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR;S=H/600;VW=W/S}
addEventListener('resize',resize);resize();
const MAPW=3000,LY=300,dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
const CLS={
 fighter:{name:'Mandirigma',em:'🗡️',role:'Fighter · matibay, malapitan',hp:980,mp:300,dmg:58,range:55,spd:178,as:.95,proj:false,col:'#f97316',
  sk:[{n:'Sugod',ic:'💨',cd:6,mp:40,d:'Sumugod pasulong, tama lahat ng madaanan'},{n:'Ikot',ic:'🌀',cd:8,mp:50,d:'Umikot, tama lahat sa paligid'},{n:'Lindol',ic:'💥',cd:28,mp:100,d:'Talon at bagsak: malaking damage + stun'}]},
 mage:{name:'Salamangkero',em:'🔮',role:'Mage · malakas na skills',hp:640,mp:520,dmg:46,range:230,spd:162,as:1.05,proj:true,col:'#a855f7',
  sk:[{n:'Bolang Apoy',ic:'🔥',cd:4,mp:50,d:'Bolang apoy na sumasabog'},{n:'Yelo',ic:'❄️',cd:9,mp:70,d:'Yelo sa paligid: damage + bagal'},{n:'Bulalakaw',ic:'☄️',cd:26,mp:120,d:'Bulalakaw sa kalaban: napakalakas'}]},
 marksman:{name:'Mamamana',em:'🏹',role:'Marksman · malayo, mabilis tumira',hp:700,mp:350,dmg:60,range:300,spd:172,as:.8,proj:true,col:'#22c55e',
  sk:[{n:'Ulan ng Pana',ic:'🎯',cd:6,mp:45,d:'5 pana nang sabay-sabay'},{n:'Bilis',ic:'⚡',cd:12,mp:50,d:'Mas mabilis tumakbo at tumira + heal'},{n:'Tagos',ic:'☄',cd:22,mp:100,d:'Panang tumatagos sa lahat'}]}};
const SN={fighter:['dash','spin','boom'],mage:['fire','ice','meteor'],marksman:['volley','haste','pierce']};
const SKR={fighter:[260,150,230],mage:[480,180,460],marksman:[400,9999,600]};
let G=null,last=0,bt=0;const keys={},inp={jx:0,jy:0,atk:false,jid:null};
const TREES=Array.from({length:80},()=>({x:rnd(0,MAPW),y:Math.random()<.5?rnd(25,160):rnd(445,590),e:Math.random()<.7?'🌳':'🌲'}));
function ent(o){return Object.assign(o,{hp:o.maxHp,atkT:0,slow:0,stun:0,buff:0,dead:false})}
function mkHero(cls,team,ai){const c=CLS[cls];return ent({kind:'hero',cls,c,team,ai,x:team?MAPW-180:180,y:LY,r:22,lvl:1,xp:0,gold:300,maxHp:c.hp,mp:c.mp,maxMp:c.mp,dmg:c.dmg,bonus:0,range:c.range,spd:c.spd,as:c.as,proj:c.proj,cd:[0,0,0],fx:team?-1:1,fy:0,respawn:0,kills:0,deaths:0,buys:0})}
function mkStruct(kind,team,x,tier){const b=kind=='base';return ent({kind,team,x,y:LY,r:b?55:32,tier,maxHp:b?6500:4500,dmg:b?170:135,range:b?280:290,spd:0,as:b?1:.9,proj:true})}
function mkMinion(team,ranged,k,i){return ent({kind:'minion',team,ranged,x:team?MAPW-150+i*30:150-i*30,y:LY,oy:rnd(-35,35),r:ranged?12:14,maxHp:(ranged?300:460)*k,dmg:(ranged?26:20)*k,range:ranged?170:30,spd:95,as:ranged?.9:1,proj:ranged})}
const isS=e=>e.kind=='tower'||e.kind=='base';
const protectedS=e=>isS(e)&&G.ents.some(o=>o.team==e.team&&!o.dead&&o.tier&&o.tier<e.tier);
const targetable=(e,team)=>!e.dead&&e.team!=team&&!protectedS(e);
const enemies=team=>G.ents.filter(e=>targetable(e,team));
function nearest(u,maxd,f){let b=null,bd=maxd;for(const e of G.ents){if(!targetable(e,u.team)||(f&&!f(e)))continue;const d=dist(u,e)-e.r;if(d<bd){bd=d;b=e}}return b}
const pickTarget=(h,r)=>nearest(h,r,e=>e.kind=='hero')||nearest(h,r);
function banner(t){const b=$('banner');b.textContent=t;b.style.opacity=1;clearTimeout(bt);bt=setTimeout(()=>b.style.opacity=0,2000)}
function hurt(t,d,src){if(t.dead||protectedS(t))return;t.hp-=d;const bg=d>=150;G.fx.push({k:'txt',x:t.x+rnd(-10,10),y:t.y-t.r-14,s:Math.round(d),c:bg?'#fb923c':t.team?'#fde047':'#f87171',t:.9,T:.9,big:bg});burst(t.x,t.y-6,bg?10:4,bg?'#fdba74':'#fff3b0',bg?260:150,{add:1});if(d>=200)G.shake=Math.max(G.shake,.25);if(t.kind=='hero'||isS(t))sfx('hit',t.x);if(t.hp<=0)kill(t,src)}
const need=h=>80+h.lvl*45;
function gainXp(h,x){h.xp+=x;while(h.lvl<15&&h.xp>=need(h)){h.xp-=need(h);h.lvl++;h.maxHp*=1.08;h.hp=Math.min(h.maxHp,h.hp*1.08+h.maxHp*.1);h.dmg*=1.07;h.maxMp*=1.05;
 G.fx.push({k:'txt',x:h.x,y:h.y-60,s:'LEVEL UP! '+h.lvl,c:'#a5f3fc',t:1.3,T:1.3,big:1});G.fx.push({k:'ring',x:h.x,y:h.y,r0:10,r1:80,c:'#67e8f9',t:.6,T:.6});for(let i=0;i<22;i++)P(h.x+rnd(-24,24),h.y+rnd(-10,20),{vy:-rnd(80,200),t:rnd(.6,1),r:rnd(2,4),c:i%2?'#67e8f9':'#fde047',add:1});if(h===G.player)sfx('lvl');if(h===G.player&&h.lvl==4)banner('⭐ Bukas na ang Ultimate!')}if(h.lvl>=15)h.xp=0}
function kill(t,src){t.dead=true;t.hp=0;const owner=src&&(src.owner||src);
 const xp={minion:35,hero:140+t.lvl*25,tower:120,base:0}[t.kind],gold={minion:22,hero:200,tower:250,base:0}[t.kind];
 G.ents.filter(h=>h.kind=='hero'&&h.team!=t.team&&!h.dead&&dist(h,t)<700).forEach(h=>gainXp(h,xp));
 G.ents.filter(h=>h.kind=='hero'&&h.team!=t.team).forEach(h=>{const g=Math.round(owner===h||t.kind=='tower'?gold:(dist(h,t)<700?gold*.35:0));h.gold+=g;if(h===G.player&&g){sfx('coin');}if(h===G.player&&g)G.fx.push({k:'txt',x:t.x,y:t.y-t.r-30,s:'+'+g+'🪙',c:'#fbbf24',t:1,T:1})});
 if(t.kind=='minion'){sfx('mdie',t.x);burst(t.x,t.y,10,'#cbd5e1',120,{r:5,g:-60})}
 if(t.kind=='hero'){sfx('hdie');burst(t.x,t.y,26,t.team?'#f87171':'#93c5fd',260,{add:1});burst(t.x,t.y,12,'#e2e8f0',90,{r:7,g:-80});t.respawn=5+t.lvl*1.5;t.deaths++;t.dash=null;if(owner&&owner.kind=='hero')owner.kills++;banner(t.team?'⚔️ Napatay mo ang kalaban!':'💀 Napatay ka!')}
 if(isS(t)){sfx('boom');G.shake=.6;burst(t.x,t.y-30,40,'#fb923c',380,{add:1,r:5});burst(t.x,t.y-20,20,'#78716c',200,{r:7,g:200})}
 if(t.kind=='tower')banner(t.team?'🗼 Nawasak ang tore ng kalaban!':'😱 Nawasak ang tore natin!');
 G.fx.push({k:'ring',x:t.x,y:t.y,r0:t.r,r1:t.r*2.5,c:'#fff',t:.4,T:.4});if(t.kind=='base')end(t.team==1)}
function bound(u){u.x=clamp(u.x,20,MAPW-20);u.y=clamp(u.y,95,505)}
function moveTo(u,tx,ty,dt,stop=0){const dx=tx-u.x,dy=ty-u.y,d=Math.hypot(dx,dy);if(d<=stop||d<1)return;u.mvT=.12;u.walk=(u.walk||0)+dt;const s=u.spd*(u.slow>0?.55:1)*(u.buff>0?1.35:1)*dt,m=Math.min(s,d-stop);u.x+=dx/d*m;u.y+=dy/d*m;if(u.kind=='hero'){u.fx=dx/d;u.fy=dy/d}bound(u)}
function tryAttack(u,t){if(u.stun>0||dist(u,t)>u.range+t.r+u.r)return false;if(u.atkT<=0){u.atkT=1/(u.as*(u.buff>0?1.6:1));const d=(u.dmg+(u.bonus||0))*(isS(u)&&t.kind=='minion'?2.6:u.kind=='minion'&&isS(t)?.5:1);
 if(u.kind=='hero'){u.swing=.2;sfx(u.cls=='fighter'?'swing':u.cls=='marksman'?'arrow':'magic',u.x)}else if(isS(u))sfx('tower',u.x);if(u.proj)G.projs.push({x:u.x,y:u.y-(isS(u)?35:0),target:t,spd:isS(u)?700:650,dmg:d,owner:u,team:u.team,r:u.kind=='minion'?4:isS(u)?9:7,life:3,c:isS(u)?(u.team?'#fb7185':'#7dd3fc'):u.kind=='hero'?u.c.col:(u.team?'#f87171':'#60a5fa')});
 else{hurt(t,d,u);if(u.kind=='hero')burst(t.x,t.y,6,'#fff',220,{add:1});G.fx.push({k:'slash',x:t.x,y:t.y,t:.15,T:.15,c:u.team?'#fca5a5':'#bfdbfe'})}}return true}
function engage(u,t,dt){if(!tryAttack(u,t)&&u.stun<=0)moveTo(u,t.x,t.y,dt,u.range+t.r+u.r-6)}
function canCast(h,i){const s=h.c.sk[i];return !h.dead&&h.stun<=0&&h.cd[i]<=0&&h.mp>=s.mp&&(i<2||h.lvl>=4)}
function castSkill(h,i,tgt){if(!G||G.over||!canCast(h,i))return;const s=h.c.sk[i];h.mp-=s.mp;h.cd[i]=s.cd;sfx(SN[h.cls][i],h.x);
 tgt=tgt||pickTarget(h,520);let dx=h.fx,dy=h.fy;if(tgt){const d=dist(h,tgt)||1;dx=(tgt.x-h.x)/d;dy=(tgt.y-h.y)/d}
 const sc=1+.13*(h.lvl-1)+h.bonus/60,col=h.team?'#f87171':h.c.col,ang=Math.atan2(dy,dx),near=r=>tgt&&dist(h,tgt)<r;
 const aoe=(x,y,r,d,f)=>{enemies(h.team).forEach(e=>{if(Math.hypot(e.x-x,e.y-y)<r+e.r){hurt(e,d,h);f&&f(e)}});G.fx.push({k:'ring',x,y,r0:10,r1:r,c:col,t:.45,T:.45,fill:1});burst(x,y,Math.min(30,r/6),col,r*2.2,{add:1,r:4})};
 const shot=(a,o)=>G.projs.push(Object.assign({x:h.x,y:h.y,vx:Math.cos(a)*o.sp,vy:Math.sin(a)*o.sp,owner:h,team:h.team,c:col,hit:new Set()},o));
 switch(h.cls+i){
 case'fighter0':h.dash={vx:dx*950,vy:dy*950,t:.25,dmg:95*sc,hit:new Set()};break;
 case'fighter1':aoe(h.x,h.y,140,120*sc);break;
 case'fighter2':{if(near(260)){h.x=tgt.x-dx*20;h.y=tgt.y-dy*20}else{h.x+=dx*120;h.y+=dy*120}bound(h);aoe(h.x,h.y,210,260*sc,e=>e.stun=1.3);G.shake=.4;break}
 case'mage0':shot(ang,{sp:620,life:.85,dmg:150*sc,r:13,aoe:85,c:'#fb923c'});break;
 case'mage1':aoe(h.x,h.y,180,95*sc,e=>e.slow=2.5);break;
 case'mage2':{const x=near(480)?tgt.x:h.x+dx*260,y=near(480)?tgt.y:h.y+dy*260;G.delayed.push({t:.8,T:.8,x,y,r:170,f:()=>{aoe(x,y,170,340*sc);G.shake=.45;sfx('boom',x);burst(x,y,30,'#fde047',420,{add:1,r:5});burst(x,y,14,'#57534e',200,{r:8,g:150})}});break}
 case'marksman0':for(let k=-2;k<=2;k++)shot(ang+k*.14,{sp:760,life:.55,dmg:75*sc,r:6});break;
 case'marksman1':h.buff=4;for(let k=0;k<16;k++)P(h.x+rnd(-20,20),h.y+rnd(-10,20),{vy:-rnd(60,150),t:.8,r:3,c:'#86efac',add:1,plus:1});h.hp=Math.min(h.maxHp,h.hp+h.maxHp*.1);G.fx.push({k:'ring',x:h.x,y:h.y,r0:h.r,r1:70,c:'#fde047',t:.4,T:.4});break;

const AU={ctx:null,on:localStorage.getItem('mobaMute')!='1',last:{}};
function auInit(){if(AU.ctx){if(AU.ctx.state=='suspended')AU.ctx.resume();return}const C=window.AudioContext||window.webkitAudioContext;if(!C)return;try{const a=AU.ctx=new C();AU.master=a.createGain();AU.master.gain.value=AU.on?.7:0;AU.master.connect(a.destination);
 AU.sfx=a.createGain();AU.sfx.gain.value=.8;AU.sfx.connect(AU.master);AU.mus=a.createGain();AU.mus.gain.value=.16;AU.mus.connect(AU.master);
 AU.noise=a.createBuffer(1,a.sampleRate*.6,a.sampleRate);const d=AU.noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;if(a.state=='suspended')a.resume()}catch(e){AU.ctx=null}}
function tone(f,dur,{type='square',vol=.2,f2=null,delay=0,dest=null,at=null}={}){const a=AU.ctx,t=(at??a.currentTime)+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0005,t+dur);o.connect(g).connect(dest||AU.sfx);o.start(t);o.stop(t+dur+.03)}
function noise(dur,{vol=.3,f=1000,q=1,type='bandpass',f2=null,delay=0,at=null,dest=null}={}){const a=AU.ctx,t=(at??a.currentTime)+delay,s=a.createBufferSource();s.buffer=AU.noise;const b=a.createBiquadFilter();b.type=type;b.frequency.setValueAtTime(f,t);if(f2)b.frequency.exponentialRampToValueAtTime(f2,t+dur);b.Q.value=q;
 const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0005,t+dur);s.connect(b).connect(g).connect(dest||AU.sfx);s.start(t);s.stop(t+dur+.02)}
const SFX={swing:()=>noise(.13,{vol:.35,f:2600,f2:500,q:1.5}),arrow:()=>{noise(.09,{vol:.25,f:4200,q:3});tone(1300,.05,{type:'triangle',vol:.06,f2:700})},magic:()=>tone(650,.16,{type:'sine',vol:.16,f2:1300}),
 hit:()=>{noise(.06,{vol:.3,f:1100,q:1.2});tone(160,.06,{type:'square',vol:.05,f2:90})},tower:()=>{tone(260,.28,{type:'sawtooth',vol:.1,f2:70});noise(.18,{vol:.18,f:700})},
 mdie:()=>tone(420,.16,{type:'square',vol:.06,f2:110}),hdie:()=>{tone(320,.7,{type:'sawtooth',vol:.18,f2:55});noise(.45,{vol:.22,f:300})},
 lvl:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.2,{type:'triangle',vol:.16,delay:i*.07})),coin:()=>{tone(988,.07,{type:'square',vol:.06});tone(1319,.16,{type:'square',vol:.06,delay:.06})},
 boom:()=>{noise(.7,{vol:.5,f:500,f2:50,type:'lowpass'});tone(110,.55,{type:'sine',vol:.4,f2:35})},dash:()=>noise(.25,{vol:.35,f:700,f2:3200,q:1}),
 spin:()=>{noise(.38,{vol:.3,f:1600,f2:400,q:2});tone(280,.3,{type:'sawtooth',vol:.06,f2:640})},fire:()=>{noise(.45,{vol:.35,f:700,f2:180,type:'lowpass'});tone(180,.3,{type:'sawtooth',vol:.08,f2:520})},
 ice:()=>[1568,2093,2637,3136].forEach((f,i)=>tone(f,.28,{type:'sine',vol:.08,delay:i*.04})),meteor:()=>{tone(1600,.8,{type:'sawtooth',vol:.07,f2:120});noise(.8,{vol:.15,f:3000,f2:300,q:1})},
 volley:()=>{for(let i=0;i<5;i++)noise(.07,{vol:.2,f:4200,q:3,delay:i*.035})},haste:()=>{tone(400,.35,{type:'triangle',vol:.16,f2:1300});tone(600,.35,{type:'sine',vol:.08,f2:1800,delay:.05})},
 pierce:()=>{tone(1900,.45,{type:'sawtooth',vol:.09,f2:180});noise(.35,{vol:.25,f:3200,f2:700,q:2})},
 win:()=>[523,659,784,1047,0,784,1047,1319].forEach((f,i)=>f&&tone(f,.32,{type:'triangle',vol:.2,delay:i*.13})),lose:()=>[392,370,349,262].forEach((f,i)=>tone(f,.5,{type:'triangle',vol:.2,delay:i*.28})),
 click:()=>tone(700,.06,{type:'sine',vol:.14})};
function sfx(n,x){if(!AU.ctx||!AU.on||AU.ctx.state!='running')return;const now=performance.now();if(now-(AU.last[n]||0)<(n=='hit'?70:45))return;AU.last[n]=now;
 if(x!=null&&G&&Math.abs(x-(G.camX+VW/2))>VW*.8)return;try{SFX[n]()}catch(e){}}
const MCH=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],mf=n=>440*2**((n-69)/12);let mStep=0,mNext=0;
function music(){if(!AU.ctx||!AU.on||AU.ctx.state!='running'||!G||G.over)return;const a=AU.ctx,spb=60/112/2;if(mNext<a.currentTime)mNext=a.currentTime+.05;
 while(mNext<a.currentTime+.35){const ch=MCH[(mStep>>3)%4],s=mStep%8;if(s%4==0)tone(mf(ch[0]-12),spb*3.6,{type:'triangle',vol:.45,dest:AU.mus,at:mNext});
  tone(mf(ch[[0,1,2,1,0,2,1,2][s]]+12),spb*.85,{type:'sine',vol:.13,dest:AU.mus,at:mNext});if(s%2)noise(.04,{vol:.08,f:8000,type:'highpass',at:mNext,dest:AU.mus});if(s==0||s==4)tone(90,.12,{type:'sine',vol:.35,f2:45,dest:AU.mus,at:mNext});mNext+=spb;mStep++}}
setInterval(music,90);
function setMute(){['mute','smute'].forEach(i=>$(i).textContent=AU.on?'🔊':'🔇');if(AU.master)AU.master.gain.value=AU.on?.7:0;localStorage.setItem('mobaMute',AU.on?'0':'1')}
['mute','smute'].forEach(i=>$(i).addEventListener('pointerdown',e=>{e.stopPropagation();auInit();AU.on=!AU.on;setMute();sfx('click')}));setMute();
