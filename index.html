<script>
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');
let DPR=1,W=0,H=0,S=1,VW=0;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR;S=H/600;VW=W/S}
addEventListener('resize',resize);resize();
const MAPW=3000,LY=300,dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
const CLS={
 fighter:{name:'Mandirigma',em:'🗡️',role:'Fighter · matibay, malapitan',hp:980,mp:300,dmg:58,range:55,spd:178,as:.95,proj:false,col:'#f97316',
  sk:[{n:'Sugod',ic:'💨',cd:6,mp:40,d:'Sumugod pasulong, tama lahat ng madaanan'},{n:'Ikot',ic:'🌀',cd:8,mp:50,d:'Umikot, tama lahat sa paligid'},{n:'Lindol',ic:'💥',cd:28,mp:100,d:'Talon at bagsak: malaking damage + stun'}]},
 mage:{name:'Salamangkero',em:'🔮',role:'Mage · malakas na skills',hp:640,mp:520,dmg:46,range:230,spd:162,as:1.05,proj:true,col:'#a855f7',
  sk:[{n:'Bolang Apoy',ic:'🔥',cd:4,mp:50,d:'Bolang apoy na sumasabog'},{n:'Yelo',ic:'❄️',cd:9,mp:70,d:'Yelo sa paligid: damage + bagal'},{n:'Bulalakaw',ic:'☄️',cd:26,mp:120,d:'Bulalakaw sa kalaban: napakalakas'}]},
 marksman:{name:'Mamamana',em:'🏹',role:'Marksman · malayo, mabilis tumira',hp:700,mp:350,dmg:60,range:300,spd:172,as:.8,proj:true,col:'#22c55e',
  sk:[{n:'Ulan ng Pana',ic:'🎯',cd:6,mp:45,d:'5 pana nang sabay-sabay'},{n:'Bilis',ic:'⚡',cd:12,mp:50,d:'Mas mabilis tumakbo at tumira + heal'},{n:'Tagos',ic:'☄',cd:22,mp:100,d:'Panang tumatagos sa lahat'}]}};
const SKR={fighter:[260,150,230],mage:[480,180,460],marksman:[400,9999,600]};
let G=null,last=0,bt=0;const keys={},inp={jx:0,jy:0,atk:false,jid:null};
const TREES=Array.from({length:80},()=>({x:rnd(0,MAPW),y:Math.random()<.5?rnd(25,160):rnd(445,590),e:Math.random()<.7?'🌳':'🌲'}));
function ent(o){return Object.assign(o,{hp:o.maxHp,atkT:0,slow:0,stun:0,buff:0,dead:false})}
function mkHero(cls,team,ai){const c=CLS[cls];return ent({kind:'hero',cls,c,team,ai,x:team?MAPW-180:180,y:LY,r:22,lvl:1,xp:0,gold:300,maxHp:c.hp,mp:c.mp,maxMp:c.mp,dmg:c.dmg,bonus:0,range:c.range,spd:c.spd,as:c.as,proj:c.proj,cd:[0,0,0],fx:team?-1:1,fy:0,respawn:0,kills:0,deaths:0,buys:0})}
function mkStruct(kind,team,x,tier){const b=kind=='base';return ent({kind,team,x,y:LY,r:b?55:32,tier,maxHp:b?6500:4500,dmg:b?170:135,range:b?280:290,spd:0,as:b?1:.9,proj:true})}
function mkMinion(team,ranged,k,i){return ent({kind:'minion',team,ranged,x:team?MAPW-150+i*30:150-i*30,y:LY,oy:rnd(-35,35),r:ranged?12:14,maxHp:(ranged?300:460)*k,dmg:(ranged?26:20)*k,range:ranged?170:30,spd:95,as:ranged?.9:1,proj:ranged})}
const isS=e=>e.kind=='tower'||e.kind=='base';
const protectedS=e=>isS(e)&&G.ents.some(o=>o.team==e.team&&!o.dead&&o.tier&&o.tier<e.tier);
const targetable=(e,team)=>!e.dead&&e.team!=team&&!protectedS(e);
const enemies=team=>G.ents.filter(e=>targetable(e,team));
function nearest(u,maxd,f){let b=null,bd=maxd;for(const e of G.ents){if(!targetable(e,u.team)||(f&&!f(e)))continue;const d=dist(u,e)-e.r;if(d<bd){bd=d;b=e}}return b}
const pickTarget=(h,r)=>nearest(h,r,e=>e.kind=='hero')||nearest(h,r);
function banner(t){const b=$('banner');b.textContent=t;b.style.opacity=1;clearTimeout(bt);bt=setTimeout(()=>b.style.opacity=0,2000)}
function hurt(t,d,src){if(t.dead||protectedS(t))return;t.hp-=d;G.fx.push({k:'txt',x:t.x+rnd(-10,10),y:t.y-t.r-12,s:Math.round(d),c:t.team?'#fde047':'#f87171',t:.8,T:.8});if(t.hp<=0)kill(t,src)}
const need=h=>80+h.lvl*45;
function gainXp(h,x){h.xp+=x;while(h.lvl<15&&h.xp>=need(h)){h.xp-=need(h);h.lvl++;h.maxHp*=1.08;h.hp=Math.min(h.maxHp,h.hp*1.08+h.maxHp*.1);h.dmg*=1.07;h.maxMp*=1.05;
 G.fx.push({k:'txt',x:h.x,y:h.y-55,s:'LEVEL UP! '+h.lvl,c:'#a5f3fc',t:1.3,T:1.3});if(h===G.player&&h.lvl==4)banner('⭐ Bukas na ang Ultimate!')}if(h.lvl>=15)h.xp=0}
function kill(t,src){t.dead=true;t.hp=0;const owner=src&&(src.owner||src);
 const xp={minion:35,hero:140+t.lvl*25,tower:120,base:0}[t.kind],gold={minion:22,hero:200,tower:250,base:0}[t.kind];
 G.ents.filter(h=>h.kind=='hero'&&h.team!=t.team&&!h.dead&&dist(h,t)<700).forEach(h=>gainXp(h,xp));
 G.ents.filter(h=>h.kind=='hero'&&h.team!=t.team).forEach(h=>{const g=Math.round(owner===h||t.kind=='tower'?gold:(dist(h,t)<700?gold*.35:0));h.gold+=g;if(h===G.player&&g)G.fx.push({k:'txt',x:t.x,y:t.y-t.r-30,s:'+'+g+'🪙',c:'#fbbf24',t:1,T:1})});
 if(t.kind=='hero'){t.respawn=5+t.lvl*1.5;t.deaths++;t.dash=null;if(owner&&owner.kind=='hero')owner.kills++;banner(t.team?'⚔️ Napatay mo ang kalaban!':'💀 Napatay ka!')}
 if(t.kind=='tower')banner(t.team?'🗼 Nawasak ang tore ng kalaban!':'😱 Nawasak ang tore natin!');
 G.fx.push({k:'ring',x:t.x,y:t.y,r0:t.r,r1:t.r*2.5,c:'#fff',t:.4,T:.4});if(t.kind=='base')end(t.team==1)}
function bound(u){u.x=clamp(u.x,20,MAPW-20);u.y=clamp(u.y,95,505)}
function moveTo(u,tx,ty,dt,stop=0){const dx=tx-u.x,dy=ty-u.y,d=Math.hypot(dx,dy);if(d<=stop||d<1)return;const s=u.spd*(u.slow>0?.55:1)*(u.buff>0?1.35:1)*dt,m=Math.min(s,d-stop);u.x+=dx/d*m;u.y+=dy/d*m;if(u.kind=='hero'){u.fx=dx/d;u.fy=dy/d}bound(u)}
function tryAttack(u,t){if(u.stun>0||dist(u,t)>u.range+t.r+u.r)return false;if(u.atkT<=0){u.atkT=1/(u.as*(u.buff>0?1.6:1));const d=(u.dmg+(u.bonus||0))*(isS(u)&&t.kind=='minion'?2.6:u.kind=='minion'&&isS(t)?.5:1);
 if(u.kind=='hero')u.swing=.15;if(u.proj)G.projs.push({x:u.x,y:u.y-(isS(u)?35:0),target:t,spd:isS(u)?700:650,dmg:d,owner:u,team:u.team,r:u.kind=='minion'?4:isS(u)?9:7,life:3,c:isS(u)?(u.team?'#fb7185':'#7dd3fc'):u.kind=='hero'?u.c.col:(u.team?'#f87171':'#60a5fa')});
 else{hurt(t,d,u);G.fx.push({k:'slash',x:t.x,y:t.y,t:.15,T:.15,c:u.team?'#fca5a5':'#bfdbfe'})}}return true}
function engage(u,t,dt){if(!tryAttack(u,t)&&u.stun<=0)moveTo(u,t.x,t.y,dt,u.range+t.r+u.r-6)}
function canCast(h,i){const s=h.c.sk[i];return !h.dead&&h.stun<=0&&h.cd[i]<=0&&h.mp>=s.mp&&(i<2||h.lvl>=4)}
function castSkill(h,i,tgt){if(!G||G.over||!canCast(h,i))return;const s=h.c.sk[i];h.mp-=s.mp;h.cd[i]=s.cd;
 tgt=tgt||pickTarget(h,520);let dx=h.fx,dy=h.fy;if(tgt){const d=dist(h,tgt)||1;dx=(tgt.x-h.x)/d;dy=(tgt.y-h.y)/d}
 const sc=1+.13*(h.lvl-1)+h.bonus/60,col=h.team?'#f87171':h.c.col,ang=Math.atan2(dy,dx),near=r=>tgt&&dist(h,tgt)<r;
 const aoe=(x,y,r,d,f)=>{enemies(h.team).forEach(e=>{if(Math.hypot(e.x-x,e.y-y)<r+e.r){hurt(e,d,h);f&&f(e)}});G.fx.push({k:'ring',x,y,r0:10,r1:r,c:col,t:.45,T:.45,fill:1})};
 const shot=(a,o)=>G.projs.push(Object.assign({x:h.x,y:h.y,vx:Math.cos(a)*o.sp,vy:Math.sin(a)*o.sp,owner:h,team:h.team,c:col,hit:new Set()},o));
 switch(h.cls+i){
 case'fighter0':h.dash={vx:dx*950,vy:dy*950,t:.25,dmg:95*sc,hit:new Set()};break;
 case'fighter1':aoe(h.x,h.y,140,120*sc);break;
 case'fighter2':{if(near(260)){h.x=tgt.x-dx*20;h.y=tgt.y-dy*20}else{h.x+=dx*120;h.y+=dy*120}bound(h);aoe(h.x,h.y,210,260*sc,e=>e.stun=1.3);G.shake=.4;break}
 case'mage0':shot(ang,{sp:620,life:.85,dmg:150*sc,r:13,aoe:85,c:'#fb923c'});break;
 case'mage1':aoe(h.x,h.y,180,95*sc,e=>e.slow=2.5);break;
 case'mage2':{const x=near(480)?tgt.x:h.x+dx*260,y=near(480)?tgt.y:h.y+dy*260;G.delayed.push({t:.8,T:.8,x,y,r:170,f:()=>{aoe(x,y,170,340*sc);G.shake=.35}});break}
 case'marksman0':for(let k=-2;k<=2;k++)shot(ang+k*.14,{sp:760,life:.55,dmg:75*sc,r:6});break;
 case'marksman1':h.buff=4;h.hp=Math.min(h.maxHp,h.hp+h.maxHp*.1);G.fx.push({k:'ring',x:h.x,y:h.y,r0:h.r,r1:70,c:'#fde047',t:.4,T:.4});break;
 case'marksman2':shot(ang,{sp:950,life:1.1,dmg:320*sc,r:16,pierce:true,c:'#facc15'});break}}
const cost=h=>250+h.buys*25;
function buy(h,k){if(h.dead&&h===G.player)return;const c=cost(h);if(h.gold<c)return;h.gold-=c;h.buys++;if(k==0)h.bonus+=16;else{h.maxHp+=170;h.hp+=170}if(h===G.player)banner(k?'❤️ +170 Buhay':'⚔️ +16 Lakas')}
function newGame(cls){const o=Object.keys(CLS).filter(k=>k!=cls);
 G={t:0,wave:2,waveN:0,ents:[],projs:[],fx:[],delayed:[],over:false,camX:0,shake:0};
 G.player=mkHero(cls,0,false);G.enemy=mkHero(o[Math.random()*2|0],1,true);
 G.ents.push(mkStruct('base',0,120,3),mkStruct('tower',0,620,2),mkStruct('tower',0,1150,1),mkStruct('tower',1,1850,1),mkStruct('tower',1,2380,2),mkStruct('base',1,2880,3),G.player,G.enemy);
 ['sel','endo'].forEach(i=>$(i).style.display='none');$('hud').style.display='flex';$('btns').style.display='block';
 G.player.c.sk.forEach((s,i)=>{$('s'+i).innerHTML=`${s.ic}<div class="cdv"></div><div class="cdt"></div><div class="mp">${s.mp}</div>`});
 banner('Kalaban: '+G.enemy.c.em+' '+G.enemy.c.name+'! Laban!')}
function end(win){G.over=true;$('btns').style.display='none';const p=G.player,e=$('endo');e.style.display='flex';
 e.innerHTML=`<h1>${win?'🏆 PANALO!':'💀 TALO...'}</h1><p>${win?'Nawasak mo ang base ng kalaban!':'Nawasak ang base natin.'}</p><p>${p.c.em} ${p.c.name} · Lv ${p.lvl} · ⚔️ ${p.kills}/${p.deaths} · ⏱ ${fmt(G.t)}</p><button class="big" id="again">🔄 Maglaro ulit</button>`;
 $('again').onclick=()=>{e.style.display='none';$('sel').style.display='flex';$('hud').style.display='none'}}
const fmt=t=>(t/60|0)+':'+String(t%60|0).padStart(2,'0');
function upHero(h,dt){
 if(h.dead){h.respawn-=dt;if(h.respawn<=0){h.dead=false;h.hp=h.maxHp;h.mp=h.maxMp;h.x=h.team?MAPW-180:180;h.y=LY;h.slow=h.stun=0;h.retreat=false;if(h===G.player)banner('Bumalik ka na! 💪')}return}
 h.cd=h.cd.map(c=>Math.max(0,c-dt));h.mp=Math.min(h.maxMp,h.mp+h.maxMp*.02*dt);h.hp=Math.min(h.maxHp,h.hp+h.maxHp*.006*dt);h.swing=Math.max(0,(h.swing||0)-dt);
 if(Math.abs(h.x-(h.team?MAPW-120:120))<260){h.hp=Math.min(h.maxHp,h.hp+h.maxHp*.15*dt);h.mp=Math.min(h.maxMp,h.mp+h.maxMp*.2*dt)}
 if(h.dash){const d=h.dash;h.x+=d.vx*dt;h.y+=d.vy*dt;bound(h);d.t-=dt;enemies(h.team).forEach(e=>{if(!d.hit.has(e)&&dist(e,h)<e.r+h.r+22){d.hit.add(e);hurt(e,d.dmg,h)}});if(d.t<=0)h.dash=null;return}
 if(h.stun>0)return;h.ai?ai(h,dt):player(h,dt)}
function player(h,dt){let jx=inp.jx,jy=inp.jy;const kx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),ky=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 if(kx||ky){const l=Math.hypot(kx,ky);jx=kx/l;jy=ky/l}const mag=Math.hypot(jx,jy),atk=inp.atk||keys.j||keys[' '];
 if(mag>.15){const sp=h.spd;h.spd*=Math.min(1,mag);moveTo(h,h.x+jx*100,h.y+jy*100,dt);h.spd=sp;if(atk){const t=pickTarget(h,h.range+h.r);if(t)tryAttack(h,t)}}
 else if(atk){const t=pickTarget(h,h.range+h.r+140);if(t)engage(h,t,dt)}}
function ai(h,dt){const own=h.team?MAPW-120:120,dir=h.team?-1:1,foe=G.ents.find(e=>e.kind=='hero'&&e.team!=h.team);
 if(h.gold>=cost(h))buy(h,h.buys%2);
 if(h.hp<h.maxHp*.28)h.retreat=true;if(h.retreat&&h.hp>h.maxHp*.92)h.retreat=false;
 if(h.retreat){if(foe&&!foe.dead&&dist(h,foe)<200&&Math.random()<dt*2){const i=h.cls=='marksman'?1:h.cls=='mage'?1:0;if(h.cls!='fighter')castSkill(h,i,foe)}moveTo(h,own,LY,dt);return}
 const mine=G.ents.filter(m=>m.kind=='minion'&&!m.dead&&m.team==h.team);
 const foeOk=foe&&!foe.dead&&dist(h,foe)<480&&foe.hp/foe.maxHp<h.hp/h.maxHp+.2;
 for(const s of G.ents){if(isS(s)&&!s.dead&&s.team!=h.team&&dist(h,s)<s.range+45&&!mine.some(m=>dist(m,s)<s.range)&&!(foeOk&&foe.hp<foe.maxHp*.2)){moveTo(h,h.x-dir*100,LY,dt);return}}
 if(foeOk){aiSkills(h,foe,false);engage(h,foe,dt);return}
 const t=nearest(h,380,e=>e.kind!='hero');if(t){aiSkills(h,t,true);engage(h,t,dt);return}
 const fx=mine.length?(h.team?Math.min(...mine.map(m=>m.x))+70:Math.max(...mine.map(m=>m.x))-70):own+dir*450;moveTo(h,fx,LY+(h.team?-45:45),dt,8)}
function aiSkills(h,t,farm){for(let i=0;i<3;i++){if(!canCast(h,i)||dist(h,t)>SKR[h.cls][i])continue;if(farm&&(i==2||h.mp<h.maxMp*.6))continue;if(Math.random()<dt0*2)castSkill(h,i,t)}}
let dt0=.016;

 ctx.fillStyle='#b4834a';ctx.fillRect(0,195,MAPW,210);ctx.fillStyle='#c9975e';for(let x=0;x<MAPW;x+=90)ctx.fillRect(x,296,45,8);
